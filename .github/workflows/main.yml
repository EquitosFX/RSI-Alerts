name: RSI alerts

on:
  schedule:
    - cron: "0 * * * *"      # hourly. */15 works too but uses 4x the minutes.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore the "already alerted" state from the previous run.
      # Cache instead of a git commit: nothing gets pushed back to the repo,
      # so a run can never collide with an edit made while it is running.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: rsi_alert_state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: |
            rsi-state-

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run RSI check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_alerts.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          key: rsi-state-${{ github.run_id }}
          path: rsi_alert_state.json
